name: Vercel Build Mirror

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  vercel-build:
    runs-on: ubuntu-latest

    # Use the same Node.js version as Vercel
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better caching

      - name: Setup pnpm (Vercel uses pnpm@10.x)
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1 # Match Vercel's pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies (mirror Vercel's frozen-lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # Mirror Vercel's environment
          NODE_ENV: production
          CI: true

      - name: Run linting (Vercel runs this)
        run: pnpm lint

      - name: Run type checking (Vercel runs this)
        run: pnpm tsc --noEmit

      - name: Build application (exact Vercel command)
        run: pnpm run build
        env:
          # Mirror Vercel's build environment
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          # Add any Vercel-specific env vars here
          NEXT_PUBLIC_BASE_URL: https://neptune-community.org

      - name: Verify build output
        run: |
          echo "Checking build artifacts..."
          ls -la .next/
          echo "Build completed successfully!"

      - name: Test production build locally
        run: |
          # Start the production server
          pnpm start &
          SERVER_PID=$!

          # Wait for server to start
          sleep 10

          # Test that the server responds
          curl -f http://localhost:3000 || exit 1

          # Test key routes
          curl -f http://localhost:3000/about || exit 1
          curl -f http://localhost:3000/roadmap || exit 1
          curl -f http://localhost:3000/exchanges || exit 1
          
          # Test OpenGraph image generation (critical for Vercel)
          curl -f http://localhost:3000/opengraph-image || exit 1

          # Clean up
          kill $SERVER_PID

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            .next/
            public/
          retention-days: 7

  # Separate job for E2E tests against the built app
  e2e-vercel-build:
    runs-on: ubuntu-latest
    needs: vercel-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests against production build
        run: pnpm test:e2e
        env:
          NODE_ENV: production

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-vercel
          path: playwright-report/
          retention-days: 30

  # Performance testing (mirror Vercel's performance monitoring)
  performance-test:
    runs-on: ubuntu-latest
    needs: vercel-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Start production server
        run: |
          pnpm start &
          echo $! > server.pid
          sleep 10

      - name: Run Lighthouse CI (mirror Vercel's performance monitoring)
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Stop production server
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  # Security scanning (mirror Vercel's security checks)
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit (mirror Vercel's security checks)
        run: pnpm audit --audit-level moderate

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
